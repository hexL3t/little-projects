<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spider Clap</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- ==== SPIDER THREAD ==== -->
      <div class="thread"></div>

      <!-- ===== HANDS & ARMS ==== -->
      <div class="arm arm-left">
        <div class="hand hand-left"></div>
      </div>
      <div class="arm arm-right">
        <div class="hand hand-right"></div>
      </div>

      <!-- ===== SPIDER ==== -->
       <div class="spider-flip">
      <div class="spider">
        <div class="abdomen">
          <div class="hourglass"></div>
          <div class="leg left1"></div>
          <div class="leg left2"></div>
          <div class="leg left3"></div>
          <div class="leg left4"></div>
          <div class="leg right1"></div>
          <div class="leg right2"></div>
          <div class="leg right3"></div>
          <div class="leg right4"></div>
        </div>
        <div class="cephalothorax">
          <div class="eye eye-1"></div>
          <div class="eye eye-2"></div>
          <div class="eye eye-3"></div>
          <div class="eye eye-4"></div>
        </div>
      </div>
      </div>
    </div>

    <div class="caption">
      <p class="prompt">$ ./squash --target bug</p>
      <p class="output">&gt; patch pending... </p>
    </div>
  </body>
</html>
